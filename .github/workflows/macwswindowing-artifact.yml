name: Build validated MacPad package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windowing:
    name: Apple SDK full package build and validation
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build tools
        run: brew install make ldid dpkg

      - name: Install Theos and the matching iOS SDK
        shell: bash
        env:
          THEOS: ${{ runner.temp }}/theos
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          if ! "$THEOS/bin/install-sdk" latest > "$RUNNER_TEMP/install-sdk.log" 2>&1; then
            tail -100 "$RUNNER_TEMP/install-sdk.log"
            exit 1
          fi
          if ! compgen -G "$THEOS/sdks/MacOSX*.sdk" >/dev/null; then
            macos_sdk_path="$(xcrun --sdk macosx --show-sdk-path)"
            macos_sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
            ln -sfn "$macos_sdk_path" "$THEOS/sdks/MacOSX${macos_sdk_version}.sdk"
          fi
          if ! command -v dyld_info >/dev/null 2>&1; then
            dyld_info_path="$(xcrun --find dyld_info 2>/dev/null || true)"
            if [ -z "$dyld_info_path" ]; then
              echo "dyld_info is unavailable in the selected Xcode toolchain" >&2
              exit 1
            fi
            echo "$(dirname "$dyld_info_path")" >> "$GITHUB_PATH"
          fi

      - name: Build and validate complete package
        shell: bash
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/MacWSWindowing.source.json"
          manifest="$RUNNER_TEMP/MacWSWindowing.build.json"
          fixups="$RUNNER_TEMP/MacWSWindowing.fixups.txt"
          package_dir="$RUNNER_TEMP/MacPad-artifact"

          python3 misc/macws_artifact_contract.py snapshot \
            --root . --manifest "$snapshot"

          gmake clean
          gmake MACWS_WINDOWING_CROSS_PREBUILT="$RUNNER_TEMP/MacWSWindowing.dylib" stage before-package \
            FINALPACKAGE=1 STRIP=0 OPTFLAG=-O2 \
            THEOS_PACKAGE_SCHEME=rootless THEOS_PLATFORM_DEB_COMPRESSION_TYPE=gzip \
            GO_EASY_ON_ME=1

          built="$RUNNER_TEMP/MacWSWindowing.dylib"
          mac_binary="$RUNNER_TEMP/MacWSWindowing.original.dylib"
          test -s "$built"
          lipo "$built" -verify_arch arm64 arm64e
          dyld_info -arch arm64e -fixups "$built" > "$fixups"

          auth_count="$(awk '$2 == "__cfstring" && $4 == "auth-bind" && /key=DA/ { n++ } END { print n+0 }' "$fixups")"
          plain_count="$(awk '$2 == "__cfstring" && $4 == "bind" { n++ } END { print n+0 }' "$fixups")"
          if [ "$auth_count" -lt 1 ] || [ "$plain_count" -ne 0 ]; then
            echo "Rejected MacWSWindowing fixups (authenticated=$auth_count plain=$plain_count)" >&2
            exit 1
          fi

          python3 misc/macws_artifact_contract.py create \
            --root . --binary "$built" --manifest "$manifest" \
            --source-snapshot "$snapshot"
          python3 misc/macws_artifact_contract.py verify \
            --root . --binary "$built" --manifest "$manifest"
          package_name="com.kdt.macosbooter"
          package_version="0.3.4"
          package_arch="iphoneos-arm64"
          package="packages/${package_name}_${package_version}_${package_arch}.deb"
          mkdir -p packages
          cp control .theos/_/DEBIAN/control
          dpkg-deb --build --root-owner-group .theos/_ "$package"
          test -s "$package"
          cp "$built" "$mac_binary"
          python3 misc/macws_artifact_contract.py verify --root . --binary "$mac_binary" --manifest "$manifest"
          python3 misc/macws_artifact_contract.py verify-package --root . --binary "$built" --manifest "$manifest" --staging .theos/_ --package "$package"

          mkdir -p "$package_dir"
          cp "$package" "$package_dir/"
          cp "$mac_binary" "$package_dir/MacWSWindowing.dylib"
          cp "$manifest" "$package_dir/MacWSWindowing.build.json"
          shasum -a 256 "$package_dir"/* > "$package_dir/SHA256SUMS"

      - name: Upload validated package
        uses: actions/upload-artifact@v7
        with:
          name: MacPad-${{ github.sha }}
          path: ${{ runner.temp }}/MacPad-artifact/
          if-no-files-found: error
          retention-days: 7
