name: Build validated MacWSWindowing artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windowing:
    name: Apple ld64 arm64e build and fixup validation
    runs-on: macos-15
    timeout-minutes: 30
    env:
      THEOS: ${{ runner.temp }}/theos

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build tools
        run: brew install gmake ldid

      - name: Install Theos and the matching iOS SDK
        shell: bash
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          if ! "$THEOS/bin/install-sdk" latest > "$RUNNER_TEMP/install-sdk.log" 2>&1; then
            tail -100 "$RUNNER_TEMP/install-sdk.log"
            exit 1
          fi
          if ! command -v dyld_info >/dev/null 2>&1; then
            dyld_info_path="$(xcrun --find dyld_info 2>/dev/null || true)"
            if [ -z "$dyld_info_path" ]; then
              echo "dyld_info is unavailable in the selected Xcode toolchain" >&2
              exit 1
            fi
            echo "$(dirname "$dyld_info_path")" >> "$GITHUB_PATH"
          fi

      - name: Build and validate arm64e artifact
        shell: bash
        run: |
          set -euo pipefail
          built="MacWSWindowing/.theos/obj/MacWSWindowing.dylib"
          snapshot="$RUNNER_TEMP/MacWSWindowing.source.json"
          manifest="$RUNNER_TEMP/MacWSWindowing.build.json"
          fixups="$RUNNER_TEMP/MacWSWindowing.fixups.txt"

          python3 misc/macws_artifact_contract.py snapshot \
            --root . --manifest "$snapshot"

          gmake -C MacWSWindowing clean all \
            FINALPACKAGE=1 STRIP=0 OPTFLAG=-O2 \
            THEOS_PACKAGE_SCHEME=rootless GO_EASY_ON_ME=1

          test -s "$built"
          lipo -verify_arch arm64 arm64e "$built"
          dyld_info -arch arm64e -fixups "$built" > "$fixups"

          auth_count="$(awk '$2 == "__cfstring" && $4 == "auth-bind" && /key=DA/ { n++ } END { print n+0 }' "$fixups")"
          plain_count="$(awk '$2 == "__cfstring" && $4 == "bind" { n++ } END { print n+0 }' "$fixups")"
          if [ "$auth_count" -lt 1 ] || [ "$plain_count" -ne 0 ]; then
            echo "Rejected MacWSWindowing fixups (authenticated=$auth_count plain=$plain_count)" >&2
            exit 1
          fi

          load_commands="$(otool -L "$built")"
          if printf '%s\n' "$load_commands" | grep -q $'\t/Library/'; then
            echo "Rejected rootful /Library load command" >&2
            exit 1
          fi
          if ! printf '%s\n' "$load_commands" | grep -q $'\t@rpath/CydiaSubstrate.framework/CydiaSubstrate '; then
            echo "Missing rootless CydiaSubstrate load command" >&2
            exit 1
          fi

          python3 misc/macws_artifact_contract.py create \
            --root . --binary "$built" --manifest "$manifest" \
            --source-snapshot "$snapshot"
          python3 misc/macws_artifact_contract.py verify \
            --root . --binary "$built" --manifest "$manifest"

          mkdir -p "$RUNNER_TEMP/MacWSWindowing-artifact"
          cp "$built" "$RUNNER_TEMP/MacWSWindowing-artifact/MacWSWindowing.dylib"
          cp "$manifest" "$RUNNER_TEMP/MacWSWindowing-artifact/MacWSWindowing.build.json"
          shasum -a 256 "$built" | awk '{ print $1 }' \
            > "$RUNNER_TEMP/MacWSWindowing-artifact/MacWSWindowing.sha256"

      - name: Upload validated artifact
        uses: actions/upload-artifact@v7
        with:
          name: MacWSWindowing-${{ github.sha }}
          path: ${{ runner.temp }}/MacWSWindowing-artifact/
          if-no-files-found: error
          retention-days: 7
